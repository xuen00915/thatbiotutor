name: Validate and deploy native WordPress snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Run source tests
        run: scripts/verify-local.sh

      - name: Start native WordPress
        run: npm run wp-env:start

      - name: Seed the reference site
        run: npm run wp-env:setup

      - name: Export the static Pages artifact
        run: >-
          python3 scripts/export_github_pages.py
          --output build
          --public-origin https://xuen00915.github.io/thatbiotutor

      - name: Install browser test dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify the exported site
        run: |
          python3 -m http.server 4173 --directory build >/tmp/tbt-pages-server.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:4173/ >/dev/null
          TBT_RUNTIME_URL=http://localhost:4173 node tests/runtime-browser-test.js
          TBT_RUNTIME_URL=http://localhost:4173 node tests/content-width-runtime.js
          TBT_RUNTIME_URL=http://localhost:4173 node tests/home-polish-runtime.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
