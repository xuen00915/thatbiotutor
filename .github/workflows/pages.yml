name: Validate and deploy native WordPress snapshot

on:
  push:
    branches:
      - main
      - fix/intensivefix
      - site/main-website
  workflow_dispatch:

permissions:
  contents: read

# Every run builds the combined latest of main and both work branches, so a newer push
# simply replaces an older run: the public link always shows everyone's latest work.
concurrency:
  group: pages-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Combine main with both work branches
        run: |
          git config user.name "tbt-ci"
          git config user.email "tbt-ci@users.noreply.github.com"
          git checkout --detach origin/main
          for branch in fix/intensivefix site/main-website; do
            if git rev-parse --verify --quiet "origin/$branch" >/dev/null; then
              git merge --no-edit "origin/$branch" || {
                echo "::error::origin/$branch conflicts with the other work. Merge origin/main into $branch locally and resolve it."
                exit 1
              }
            fi
          done
          git log --oneline -5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Run source tests
        run: scripts/verify-local.sh

      - name: Compute export cache key
        id: export-key
        run: echo "key=pages-export-v1-$(python3 scripts/pages_cache.py key)" >> "$GITHUB_OUTPUT"

      - name: Restore validated export
        if: github.event_name != 'workflow_dispatch'
        id: export-cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: ${{ steps.export-key.outputs.key }}

      - name: Start native WordPress
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: npm run wp-env:start

      - name: Seed the reference site
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: npm run wp-env:setup

      - name: Export the static Pages artifact
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: >-
          python3 scripts/export_github_pages.py
          --output build
          --public-origin https://xuen00915.github.io/thatbiotutor

      - name: Refresh CSS and static assets in cached export
        if: steps.export-cache.outputs.cache-hit == 'true'
        run: python3 scripts/pages_cache.py refresh

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser test dependencies
        run: |
          npx playwright install --only-shell chromium
          # Hosted runners often already have the libraries. Probe the actual browser
          # first; install OS packages only if that fails, then verify again.
          probe_browser() {
            node -e "require('playwright').chromium.launch().then(async b => { const p = await b.newPage(); await p.setContent('<p>Ready</p>'); await b.close(); }).catch(e => { console.error(e.message); process.exit(1); })"
          }
          if ! probe_browser; then
            npx playwright install-deps chromium
            probe_browser
          fi

      - name: Verify the exported site
        run: |
          python3 -m http.server 4173 --directory build >/tmp/tbt-pages-server.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:4173/ >/dev/null
          TBT_RUNTIME_URL=http://localhost:4173 TBT_RUNTIME_WORKERS=3 node scripts/run-browser-tests.js

      - name: Verify WordPress editing
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          # A client's workflow in wp-admin (edit, format, save, add a class year) on the live WordPress, which restores what it touches.
          TBT_RUNTIME_URL=http://localhost:8888 node tests/admin-editing-runtime.js

      - name: Upload browser test logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          include-hidden-files: true
          path: .artifacts/browser-tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Cache validated export
        if: steps.export-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.export-key.outputs.key }}

      - name: Build WordPress upload package
        run: python3 scripts/build_wordpress_package.py --output "$RUNNER_TEMP/tbt-wordpress-install"

      - name: Upload WordPress installation package
        uses: actions/upload-artifact@v4
        with:
          name: thatbiotutor-wordpress-install
          path: ${{ runner.temp }}/tbt-wordpress-install/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
