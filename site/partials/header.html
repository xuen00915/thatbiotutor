<header class="site-header original-header">
  <div class="container site-header__inner">
    <a class="site-brand" href="{{ home_url }}" aria-label="ThatBioTutor home">
      <img src="{{ root }}{{ logo }}" width="192" height="192" alt="ThatBioTutor leaf logo">
      <span>{{ site_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" data-menu-toggle aria-label="Open navigation menu">☰</button>
      <div class="site-nav__links" id="site-menu" data-site-menu>
        {{ nav_html }}
      </div>
    </nav>
  </div>
</header>
