<!-- ELEMENTOR CONTAINER: Shared track record; CLIENT EDIT values in pages.json. -->
<section class="{{ track_section_class }}" id="results" aria-labelledby="results-title">
  <div class="container container--wide">
    <div class="section-heading"><p class="eyebrow">{{ track_eyebrow }}</p><h2 id="results-title">Here’s the Track Record</h2></div>
    <div class="stats" aria-label="ThatBioTutor student results">
      <article class="stat"><strong class="stat__value" data-counter-key="students">912+</strong><p class="stat__label">Students taught across 98 Singapore schools</p></article>
      <article class="stat"><strong class="stat__value" data-counter-key="results">91%</strong><p class="stat__label">Score A1, A2, or B3, despite 69% starting at B4 or lower</p></article>
      <article class="stat"><strong class="stat__value" data-counter-key="gradeJump">2.3</strong><p class="stat__label">Average grade jump, roughly C5 to A2</p></article>
      <article class="stat"><strong class="stat__value" data-counter-key="{{ track_fourth_key }}">{{ track_fourth_value }}</strong><p class="stat__label">{{ track_fourth_label }}</p></article>
    </div>
    <div class="media-grid section section--compact">
      <figure class="media-grid__item"><img src="{{ root }}assets/images/shared/track-record-01.webp" data-supplied-group="trackRecord" width="2048" height="1536" loading="lazy" alt="A group of ThatBioTutor students smiling in class"></figure>
      <figure class="media-grid__item"><img src="{{ root }}assets/images/shared/track-record-02.webp" data-supplied-group="trackRecord" width="3024" height="4032" loading="lazy" alt="Mr Keefe giving focused guidance to students at their desks"></figure>
      <figure class="media-grid__item"><img src="{{ root }}assets/images/shared/track-record-03.webp" data-supplied-group="trackRecord" width="1536" height="2048" loading="lazy" alt="Mr Keefe celebrating with three biology students"></figure>
      <figure class="media-grid__item"><img src="{{ root }}assets/images/shared/track-record-04.webp" data-supplied-group="trackRecord" width="1600" height="974" loading="lazy" alt="Mr Keefe leading an online biology class over Zoom"></figure>
    </div>
  </div>
</section>
