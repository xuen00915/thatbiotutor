<!-- ELEMENTOR CONTAINER: Shared results for class pages. -->
<section class="section section--soft class-results-strip" id="results" data-layout-slot="results" aria-labelledby="class-results-title">
  <div class="container container--wide">
    <div class="section-heading section-heading--center"><p class="eyebrow">TBT by the numbers</p><h2 id="class-results-title">{{ results_title }}</h2><p class="lead">{{ results_intro }}</p></div>
    <div class="stats stats--six" aria-label="ThatBioTutor class results">
      <article class="stat"><strong class="stat__value">98</strong><p class="stat__label">Different Singapore schools represented</p></article>
      <article class="stat"><strong class="stat__value">912+</strong><p class="stat__label">Students and families taught</p></article>
      <article class="stat"><strong class="stat__value">91%</strong><p class="stat__label">Score A1, A2, or B3</p></article>
      <article class="stat"><strong class="stat__value">69.21%</strong><p class="stat__label">Started at B4 or lower</p></article>
      <article class="stat"><strong class="stat__value">2.3</strong><p class="stat__label">Average grade improvement</p></article>
      <article class="stat"><strong class="stat__value">1 in 2</strong><p class="stat__label">Score an A distinction</p></article>
    </div>
  </div>
</section>
