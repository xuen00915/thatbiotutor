<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ description }}">
    <meta name="theme-color" content="#063e2f">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{{ og_image_url }}">
    <title>{{ title }}</title>
    <link rel="canonical" href="{{ canonical_url }}">
    <link rel="icon" type="image/webp" href="{{ root }}{{ favicon }}">
    <link rel="stylesheet" href="{{ root }}assets/css/base.css">
    <link rel="stylesheet" href="{{ root }}assets/css/components.css">
    <link rel="stylesheet" href="{{ root }}assets/css/pages.css">
    <script defer src="{{ root }}assets/js/content.js"></script>
    <script defer src="{{ root }}assets/js/site.js"></script>
  </head>
  <body class="{{ body_class }}">
    <a class="skip-link" href="#main">Skip to main content</a>
    <!-- INCLUDE: partials/header.html -->
    {{ main_html }}
    <!-- INCLUDE: partials/footer.html -->
    <!-- INCLUDE: partials/floating-whatsapp.html -->
  </body>
</html>
